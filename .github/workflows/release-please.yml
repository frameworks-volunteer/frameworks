name: Release Please

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Create release PR
        uses: googleapis/release-please-action@a02a34c4d625f8be7a892fc3b8a09a2f6b7ea46c # v4.1.3
        with:
          release-type: simple
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json